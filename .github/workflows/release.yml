name: Release

# Manual by design for now (the first install channel is git clone + cmake;
# packages arrive with OBS/AUR in Fase 2): run this workflow from the Actions
# tab and type the tag. It verifies the tag matches project(VERSION), sums
# the GitHub source tarball, and creates the release with notes built from
# the CHANGELOG section + docs/RELEASE_TEMPLATE.md. No builds here — source
# only. Per-distro .deb/.rpm download links (OBS/COPR) get pasted into the
# notes at release time; the AppImage is optional and lives in appimage.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
      publish:
        description: 'Actually create the release (unchecked = dry run: guard + sums + notes printed only)'
        type: boolean
        required: false
        default: false

jobs:
  source-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Version guard (tag must match project(VERSION))
        run: |
          set -euo pipefail
          tag="${INPUT_TAG#v}"
          ver="$(sed -nE 's/^ VERSION ([0-9.]+)$/\1/p' CMakeLists.txt)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $INPUT_TAG != project(VERSION $ver); bump CMakeLists.txt and aboutdata.json first"
            exit 1
          fi
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Source checksums
        run: |
          set -euo pipefail
          tarball="kwal-${INPUT_TAG#v}.tar.gz"
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${INPUT_TAG}.tar.gz" -o "$tarball"
          sha256sum "$tarball" > sha256sums.txt
          cat sha256sums.txt
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Build release notes (always, also on dry runs)
        run: |
          set -euo pipefail
          ver="${INPUT_TAG#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { insec = 1 }
            insec && /^## \[/ && $0 !~ "^## \\[" v "\\]" { exit }
            insec { print }
          ' CHANGELOG.md > notes.md
          cat docs/RELEASE_TEMPLATE.md >> notes.md
          cat notes.md
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Create release
        if: inputs.publish
        run: |
          set -euo pipefail
          ver="${INPUT_TAG#v}"
          gh release create "$INPUT_TAG" sha256sums.txt \
            --title "Kwal $ver" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
