name: Release

# Manual by design: run it from the Actions tab on the main ref and type the
# tag. It guards that the tag matches project(VERSION), builds the notes from
# the tag message plus the commits since the previous tag, shows them in the
# run summary, and only publishes with publish=true. The normal entry point is
# scripts/release.sh (bump, commit, tag, push); this workflow is the publish
# step. No builds, and no checksum asset: GitHub's source archives are
# generated on demand, so their bytes are not ours to pin.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
      publish:
        description: 'Actually create the release (unchecked = dry run: guard + the exact notes rendered in the run summary)'
        type: boolean
        required: false
        default: false

jobs:
  source-release:
    runs-on: ubuntu-latest
    # Creating a release needs push access; the token is read-only by default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # The notes diff against the previous tag; the default depth 1 has
          # no history.
          fetch-depth: 0

      - name: Version guard (tag must match project(VERSION))
        run: |
          set -euo pipefail
          tag="${INPUT_TAG#v}"
          ver="$(sed -nE 's/^ VERSION ([0-9.]+)$/\1/p' CMakeLists.txt)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $INPUT_TAG != project(VERSION $ver); bump CMakeLists.txt and aboutdata.json first"
            exit 1
          fi
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Build release notes (always, also on dry runs)
        run: |
          set -euo pipefail
          ver="${INPUT_TAG#v}"
          : > notes.md
          # Intro: the tag body, else its subject; "Kwal X.Y.Z" repeats the title.
          intro="$(git for-each-ref --format='%(contents:body)' "refs/tags/${INPUT_TAG}")"
          if [ -z "$intro" ]; then
            intro="$(git for-each-ref --format='%(contents:subject)' "refs/tags/${INPUT_TAG}")"
          fi
          if [ -n "$intro" ] && [ "$intro" != "Kwal $ver" ]; then
            printf '%s\n\n' "$intro" >> notes.md
          fi
          # Changes: commits since the previous tag, grouped by
          # conventional-commit type; a first release has none.
          # <tag>^ is not a valid revision (a tag is not a commit), so peel it.
          if prev="$(git describe --tags --abbrev=0 --exclude "$INPUT_TAG" "${INPUT_TAG}^{commit}" 2>/dev/null)"; then
            # Plain bash: the runner's mawk and the local gawk disagree on this regex.
            declare -A group_of=([feat]=Added [fix]=Fixed)
            declare -A body=()
            while IFS=$'\t' read -r subject hash; do
              [ -n "$subject" ] || continue
              type="${subject%%:*}"
              type="${type%%(*}"
              type="${type%!}"
              group="${group_of[$type]-Other}"
              # Release bodies don't autolink bare hashes.
              link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${hash}"
              body[$group]+="- $subject ([${hash}](${link}))"$'\n'
            done < <(git log --no-merges --reverse --format='%s%x09%h' "${prev}..${INPUT_TAG}" \
                       | { grep -v '^chore(release):' || true; })
            for group in Added Fixed Other; do
              [ -n "${body[$group]-}" ] || continue
              printf '### %s\n\n%s\n' "$group" "${body[$group]}" >> notes.md
            done
          else
            printf 'first release: no tag before %s, the tag message is the note\n' "$INPUT_TAG" >&2
          fi
          cat notes.md
          # Review gate for publish=false: the exact body a publish run ships.
          { printf '## Release notes a publish run would ship for %s\n\n' "$INPUT_TAG"
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Create release
        if: inputs.publish
        run: |
          set -euo pipefail
          ver="${INPUT_TAG#v}"
          # No --target: the release attaches to the existing tag anyway, and
          # an old target commit triggers GitHub's release workflow-scope audit
          # (403: GITHUB_TOKEN can never hold workflows:write).
          # Re-runs edit instead of dying; --draft=false publishes a leftover draft.
          if gh release view "$INPUT_TAG" >/dev/null 2>&1; then
            gh release edit "$INPUT_TAG" --draft=false \
              --title "Kwal $ver" --notes-file notes.md
          else
            # --verify-tag: never invent a tag from a typo'd input.
            gh release create "$INPUT_TAG" --verify-tag \
              --title "Kwal $ver" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
