name: Release

# Manual by design (the install channel today is git clone + cmake; packages
# arrive with AUR/OBS in Fase 2): run this workflow from the Actions tab **on
# the main ref** and type the tag in the input. It checks the tag matches
# project(VERSION), then writes the notes itself: the tag message as the
# intro (the default "Kwal X.Y.Z" one-liner is skipped, the release title
# already says that) and every commit between the previous tag and this one,
# grouped by conventional-commit type. On the first release there is nothing to
# diff against, so the note is just the tag message. No builds here, and no
# checksum asset on purpose: an unsigned sha256 next to the file it hashes
# proves nothing (whoever could swap the tarball could rewrite the sums), and
# GitHub generates the archive tarballs on the fly, so pinning their hash is a
# time bomb (GitHub changed gzip behaviour in Feb 2023 and mass-broke pinned
# hashes).
#
# Publish is a two-step gate: run with publish=false, read the rendered body in
# the run summary (the "Build release notes" step), then re-run the same
# workflow with publish=true.
#
# Normal entry point: scripts/release.sh <version> bumps the version, commits,
# tags, pushes and regenerates the AUR .SRCINFO. Run this workflow by
# hand for the publish step (or when there is no gh CLI).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
      publish:
        description: 'Actually create the release (unchecked = dry run: guard + the exact notes rendered in the run summary)'
        type: boolean
        required: false
        default: false

jobs:
  source-release:
    runs-on: ubuntu-latest
    # The GITHUB_TOKEN otherwise carries only the repo's default (read for
    # contents). Creating a release needs push access — REST releases docs:
    # "Users with push access to the repository can create a release" — and the
    # first run of this workflow died exactly there (all read-only steps green,
    # `gh release create` exit 1). Write is scoped to this job only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # The notes list the commits between the previous tag and this one,
          # so the history has to be there (the default depth 1 has none).
          fetch-depth: 0

      - name: Version guard (tag must match project(VERSION))
        run: |
          set -euo pipefail
          tag="${INPUT_TAG#v}"
          ver="$(sed -nE 's/^ VERSION ([0-9.]+)$/\1/p' CMakeLists.txt)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $INPUT_TAG != project(VERSION $ver); bump CMakeLists.txt and aboutdata.json first"
            exit 1
          fi
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Build release notes (always, also on dry runs)
        run: |
          set -euo pipefail
          ver="${INPUT_TAG#v}"
          : > notes.md
          # 1. The intro is the tag message body when there is one (the prose
          #    intro written with `git tag -a -F notes.txt`; the command
          #    substitution trims the trailing blank lines), else its subject
          #    line. The default one-liner "Kwal X.Y.Z" repeats the release
          #    title, so it is left out.
          intro="$(git for-each-ref --format='%(contents:body)' "refs/tags/${INPUT_TAG}")"
          if [ -z "$intro" ]; then
            intro="$(git for-each-ref --format='%(contents:subject)' "refs/tags/${INPUT_TAG}")"
          fi
          if [ -n "$intro" ] && [ "$intro" != "Kwal $ver" ]; then
            printf '%s\n\n' "$intro" >> notes.md
          fi
          # 2. The changes: every commit between the previous tag and this one,
          #    grouped by conventional-commit type. With no tag before it this
          #    is the first release: there is nothing to diff against, and the
          #    intro above is the whole note.
          # <tag>^ is not a valid revision (a tag is not a commit), so peel it.
          if prev="$(git describe --tags --abbrev=0 --exclude "$INPUT_TAG" "${INPUT_TAG}^{commit}" 2>/dev/null)"; then
            # Plain bash, no awk: the runner's awk is mawk, the local one is
            # gawk, and their regex dialects differ on this splitting.
            declare -A group_of=([feat]=Added [fix]=Fixed)
            declare -A body=()
            while IFS=$'\t' read -r subject hash; do
              [ -n "$subject" ] || continue
              type="${subject%%:*}"
              type="${type%%(*}"
              type="${type%!}"
              group="${group_of[$type]-Other}"
              # Markdown link: a bare short hash is not autolinked in a release
              # body, so the id has to carry its own URL. GITHUB_SERVER_URL and
              # GITHUB_REPOSITORY come from the runner (no owner hardcoded).
              link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${hash}"
              body[$group]+="- $subject ([${hash}](${link}))"$'\n'
            done < <(git log --no-merges --reverse --format='%s%x09%h' "${prev}..${INPUT_TAG}" \
                       | { grep -v '^chore(release):' || true; })
            for group in Added Fixed Other; do
              [ -n "${body[$group]-}" ] || continue
              printf '### %s\n\n%s\n' "$group" "${body[$group]}" >> notes.md
            done
          else
            printf 'first release: no tag before %s, the tag message is the note\n' "$INPUT_TAG" >&2
          fi
          cat notes.md
          # The review gate: the run page renders exactly the body a publish
          # run would ship (same markdown as the release page).
          { printf '## Release notes a publish run would ship for %s\n\n' "$INPUT_TAG"
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Create release
        if: inputs.publish
        run: |
          set -euo pipefail
          ver="${INPUT_TAG#v}"
          # No --target at all. The tag already exists (--verify-tag below) and
          # GitHub always attaches the release to the tag's own commit;
          # target_commitish only names where a *new* tag would be cut, which
          # never happens here. Passing it is actively harmful: the tag *name*
          # died with HTTP 422 "Release.target_commitish is invalid" (first
          # publish run), and the tag's *commit SHA* dies with HTTP 403 "Resource
          # not accessible by integration" — since the Nov-2023 "enforcing
          # workflow scope when creating a release" change, a target commit
          # behind the default branch's HEAD makes GitHub audit the target..HEAD
          # range, and if it touches .github/workflows/ it demands the
          # workflows:write permission, which a GITHUB_TOKEN can never hold (the
          # v0.1.1 publish run died exactly there: the workflow fix between the
          # tag and main's HEAD was in that range).
          # Re-running must fix an existing release instead of dying on it.
          # --draft=false matters: a release whose tag was deleted stays behind
          # as a *draft*, and gh release edit alone would keep it unpublished
          # (the documented idiom for publishing a draft is exactly this flag).
          if gh release view "$INPUT_TAG" >/dev/null 2>&1; then
            gh release edit "$INPUT_TAG" --draft=false \
              --title "Kwal $ver" --notes-file notes.md
          else
            # --verify-tag: the release must attach to a tag that already
            # exists, never invent a new one (a typo in the input would
            # otherwise cut a tag at the default branch and ship from it).
            gh release create "$INPUT_TAG" --verify-tag \
              --title "Kwal $ver" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
