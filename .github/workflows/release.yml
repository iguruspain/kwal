name: Release

# Manual by design (the install channel today is git clone + cmake; packages
# arrive with AUR/OBS in Fase 2): run this workflow from the Actions tab **on
# the main ref** and type the tag in the input. It checks the tag matches
# project(VERSION) and that the tag is **signed and trusted by the key shipped
# in docs/kwal_signers**, then writes the notes itself: the tag message as the
# intro, every commit between the previous tag and this one grouped by
# conventional-commit type (on the first release there is nothing to diff
# against, so the tag message is the note), and the tail from
# docs/RELEASE_TEMPLATE.md **as it exists on the dispatched branch** (reading it
# from the tagged tree publishes stale wording forever — that is how the first
# v0.1.0 notes came out wrong). No builds here, and no
# checksum asset on purpose: an unsigned sha256 next to the file it hashes
# proves nothing (whoever could swap the tarball could rewrite the sums), and
# GitHub generates the archive tarballs on the fly, so pinning their hash is a
# time bomb (GitHub changed gzip behaviour in Feb 2023 and mass-broke pinned
# hashes). Provenance is the signed tag: the notes tell users to clone and
# `git verify-tag`.
#
# Publish is a two-step gate: run with publish=false, read the rendered body in
# the run summary (the "Build release notes" step), then re-run the same
# workflow with publish=true.
#
# Normal entry point: scripts/release.sh <version> bumps the version, commits,
# signs the tag, pushes and regenerates the AUR .SRCINFO. Run this workflow by
# hand for the publish step (or when there is no gh CLI).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
      publish:
        description: 'Actually create the release (unchecked = dry run: guard + signature check + the exact notes rendered in the run summary)'
        type: boolean
        required: false
        default: false

jobs:
  source-release:
    runs-on: ubuntu-latest
    # The GITHUB_TOKEN otherwise carries only the repo's default (read for
    # contents). Creating a release needs push access — REST releases docs:
    # "Users with push access to the repository can create a release" — and the
    # first run of this workflow died exactly there (all read-only steps green,
    # `gh release create` exit 1). Write is scoped to this job only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # The notes list the commits between the previous tag and this one,
          # so the history has to be there (the default depth 1 has none).
          fetch-depth: 0

      - name: Version guard (tag must match project(VERSION))
        run: |
          set -euo pipefail
          tag="${INPUT_TAG#v}"
          ver="$(sed -nE 's/^ VERSION ([0-9.]+)$/\1/p' CMakeLists.txt)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $INPUT_TAG != project(VERSION $ver); bump CMakeLists.txt and aboutdata.json first"
            exit 1
          fi
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Signature guard (the tag must be signed by the repo's key)
        run: |
          set -euo pipefail
          # The one authenticity check in this chain. The signer identity and
          # the public key come from the tagged tree itself, so a release can
          # only be cut from a tag that the repo says is signed by that key.
          git fetch --no-tags --depth=1 \
            origin "refs/tags/${INPUT_TAG}:refs/tags/${INPUT_TAG}"
          if ! git -c gpg.ssh.allowedSignersFile=docs/kwal_signers verify-tag "$INPUT_TAG"; then
            echo "::error::$INPUT_TAG is not a signed tag trusted by docs/kwal_signers — cut it with scripts/release.sh (git tag -s)"
            exit 1
          fi
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Build release notes (always, also on dry runs)
        run: |
          set -euo pipefail
          ver="${INPUT_TAG#v}"
          # The tail is read from the dispatched branch, not the tagged tree
          # (see header): a wording fix on main must reach a tag already cut.
          git fetch --no-tags --depth=1 origin "refs/heads/${NOTES_REF}" \
            || { echo "::error::notes ref ${NOTES_REF} is not a branch: dispatch this workflow from main and put the tag in the tag input"; exit 1; }
          : > notes.md
          # 1. The intro is the signed tag message. The default one-liner
          #    "Kwal X.Y.Z" repeats the release title, so it is left out.
          intro="$(git for-each-ref --format='%(contents:body)' "refs/tags/${INPUT_TAG}" | sed -e '/./,$!d')"
          if [ -n "$intro" ] && [ "$intro" != "Kwal $ver" ]; then
            printf '%s\n\n' "$intro" >> notes.md
          fi
          # 2. The changes: every commit between the previous tag and this one,
          #    grouped by conventional-commit type. With no tag before it this
          #    is the first release: there is nothing to diff against, and the
          #    intro above is the whole note.
          if prev="$(git describe --tags --abbrev=0 --exclude "$INPUT_TAG" "${INPUT_TAG}^" 2>/dev/null)"; then
            git log --no-merges --reverse --format='%s%x09%h' "${prev}..${INPUT_TAG}" \
              | { grep -v '^chore(release):' || true; } \
              | awk -F '\t' '
                  {
                    subject = $1; hash = $2
                    if (match(subject, "^[a-zA-Z]+(\\([^)]*\\))?!?:")) type = substr(subject, 1, index(subject, ":"))
                    else type = "other"
                    sub(/\\(.*/, "", type); sub(/!?:$/, "", type)
                    group = (type == "feat") ? "Added" : (type == "fix") ? "Fixed" : "Other"
                    lines[group] = lines[group] sprintf("- %s (%s)\n", subject, hash)
                    seen[group] = 1
                  }
                  END {
                    n = split("Added Fixed Other", names)
                    for (i = 1; i <= n; i++) if (seen[names[i]]) printf "### %s\n\n%s\n", names[i], lines[names[i]]
                  }' >> notes.md
          else
            printf 'first release: no tag before %s, the tag message is the note\n' "$INPUT_TAG" >&2
          fi
          # 3. The tail is version-neutral source; stamp the tag into it. Its
          #    own leading comment block is instructions for us, not text.
          git show FETCH_HEAD:docs/RELEASE_TEMPLATE.md \
            | awk '/^<!--/{c=1} c{if ($0 ~ /^-->/) c=0; next} {print}' \
            | sed "s/X\.Y\.Z/$ver/g" >> notes.md
          cat notes.md
          # The review gate: the run page renders exactly the body a publish
          # run would ship (same markdown as the release page).
          { printf '## Release notes a publish run would ship for %s\n\n' "$INPUT_TAG"
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          INPUT_TAG: ${{ inputs.tag }}
          NOTES_REF: ${{ github.ref_name }}

      - name: Create release
        if: inputs.publish
        run: |
          set -euo pipefail
          ver="${INPUT_TAG#v}"
          # Re-running must fix an existing release instead of dying on it.
          if gh release view "$INPUT_TAG" >/dev/null 2>&1; then
            gh release edit "$INPUT_TAG" --target "$INPUT_TAG" \
              --title "Kwal $ver" --notes-file notes.md
          else
            gh release create "$INPUT_TAG" --target "$INPUT_TAG" \
              --title "Kwal $ver" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
