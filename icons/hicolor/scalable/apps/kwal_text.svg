
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="125 -8 510 228"
     width="510" height="228">

  <defs>
    <!-- Gradiente cromático completo -->
    <linearGradient id="jelly" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0%" stop-color="#54E7D9"/>
      <stop offset="28%" stop-color="#70BFFF"/>
      <stop offset="55%" stop-color="#AB8CFF"/>
      <stop offset="78%" stop-color="#F17BCB"/>
      <stop offset="100%" stop-color="#FFB38F"/>
    </linearGradient>

    <!-- Blanco translúcido -->
    <linearGradient id="translucency" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".34"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".23"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".30"/>
    </linearGradient>

      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
    </defs>

    <!-- Halo cromático exterior -->
    <text x="380" y="178"
          text-anchor="middle"
          font-family="Arial Rounded MT Bold, Nunito, sans-serif"
          font-size="194"
          font-weight="900"
          letter-spacing="-9"
          fill="none"
          stroke="url(#jelly)"
          stroke-width="19"
          stroke-linejoin="round"
          opacity=".35"
          filter="url(#glow)">kwal</text>

    <!-- Borde cromático -->
    <text x="380" y="178"
          text-anchor="middle"
          font-family="Arial Rounded MT Bold, Nunito, sans-serif"
          font-size="194"
          font-weight="900"
          letter-spacing="-9"
          fill="url(#jelly)"
          stroke="url(#jelly)"
          stroke-width="13"
          stroke-linejoin="round">kwal</text>

    <!-- Interior: el mismo gradiente cromático -->
    <text x="380" y="178"
          text-anchor="middle"
          font-family="Arial Rounded MT Bold, Nunito, sans-serif"
          font-size="194"
          font-weight="900"
          letter-spacing="-9"
          fill="url(#jelly)">kwal</text>

    <!-- Única capa blanca translúcida -->
    <text x="380" y="178"
          text-anchor="middle"
          font-family="Arial Rounded MT Bold, Nunito, sans-serif"
          font-size="194"
          font-weight="900"
          letter-spacing="-9"
          fill="url(#translucency)">kwal</text>
</svg>
