<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" width="1200" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <title>kwal</title>

  <style>
    .l { transform-box: fill-box; transform-origin: 50% 100%; animation: wobble 4.6s ease-in-out infinite; }
    .l2 { animation-delay: -1.1s; }
    .l3 { animation-delay: -2.2s; }
    .l4 { animation-delay: -3.3s; }
    @keyframes wobble {
      0%, 100% { transform: scale(1, 1); }
      22%      { transform: scale(.975, 1.04); }
      55%      { transform: scale(1.012, .985); }
      78%      { transform: scale(.992, 1.015); }
    }
    .star { transform-box: fill-box; transform-origin: 50% 50%; animation: twinkle 3.2s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { transform: scale(.25) rotate(0deg);  opacity: 0; }
      30%      { transform: scale(1)   rotate(45deg); opacity: 1; }
      60%      { transform: scale(.6)  rotate(90deg); opacity: .8; }
    }
    @media (prefers-reduced-motion: reduce) { .l, .star { animation: none; } .star { opacity: 1; } }
  </style>

  <defs>
    <!-- Mismo degradado radial que la medusa: nace arriba a la derecha y se expande -->
    <radialGradient id="paint" gradientUnits="userSpaceOnUse" cx="1130" cy="40" r="1250">
      <animate attributeName="r" values="1200;1330;1260;1200" keyTimes="0;.26;.6;1" dur="6.5s" repeatCount="indefinite"/>
      <stop offset="0"    stop-color="#fab78b"/>
      <stop offset="0.18" stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#ff8fd0;#f472b6" dur="1.3s" repeatCount="indefinite"/></stop>
      <stop offset="0.42" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#c4a5ff;#a78bfa" dur="1.7s" repeatCount="indefinite"/></stop>
      <stop offset="0.7"  stop-color="#60a5fa"><animate attributeName="stop-color" values="#60a5fa;#5cd6ff;#60a5fa" dur="2.1s" repeatCount="indefinite"/></stop>
      <stop offset="1"    stop-color="#5eead4"><animate attributeName="stop-color" values="#5eead4;#7dffd9;#5eead4" dur="1.5s" repeatCount="indefinite"/></stop>
    </radialGradient>

    <!-- Brillo gelatinoso interior (misma receta que el gloss de la campana) -->
    <radialGradient id="inner" cx=".42" cy=".4" r=".62">
      <stop offset="0"   stop-color="#fff" stop-opacity=".62"/>
      <stop offset=".6"  stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <g font-family="Nunito, 'Arial Rounded MT Bold', sans-serif" font-size="520" font-weight="900" text-anchor="middle">

    <g class="l l1">
      <text x="200" y="450" fill="url(#paint)" stroke="url(#paint)" stroke-width="35" stroke-linejoin="round">k</text>
      <text x="200" y="450" fill="url(#inner)">k</text>
      <text x="200" y="450" fill="url(#gloss)">k</text>
    </g>
    <g class="l l2">
      <text x="550" y="450" fill="url(#paint)" stroke="url(#paint)" stroke-width="35" stroke-linejoin="round">w</text>
      <text x="550" y="450" fill="url(#inner)">w</text>
      <text x="550" y="450" fill="url(#gloss)">w</text>
    </g>
    <g class="l l3">
      <text x="890" y="450" fill="url(#paint)" stroke="url(#paint)" stroke-width="35" stroke-linejoin="round">a</text>
      <text x="890" y="450" fill="url(#inner)">a</text>
      <text x="890" y="450" fill="url(#gloss)">a</text>
    </g>
    <g class="l l4">
      <text x="1090" y="450" fill="url(#paint)" stroke="url(#paint)" stroke-width="35" stroke-linejoin="round">l</text>
      <text x="1090" y="450" fill="url(#inner)">l</text>
      <text x="1090" y="450" fill="url(#gloss)">l</text>
    </g>
  </g>

  <!-- Destello cartoon, como el de la medusa -->
  <g transform="translate(1158 36)">
    <g class="star">
      <path d="M0,-18 Q2.5,-2.5 18,0 Q2.5,2.5 0,18 Q-2.5,2.5 -18,0 Q-2.5,-2.5 0,-18Z" fill="#fff"/>
      <circle r="3" fill="#fff"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
