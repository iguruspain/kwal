<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 15 100 100" width="128" height="128">
  <title>Kwal (prueba: tentáculo que pinta)</title>
  <defs>
    <!-- El degradado nace en el punto de contacto (91.4,35.2) y se expande por la campana -->
    <radialGradient id="paint" gradientUnits="userSpaceOnUse" cx="91.4" cy="35.2" r="76">
      <stop offset="0"    stop-color="#fab78b"/>
      <stop offset="0.18"    stop-color="#f472b6"/>
      <stop offset="0.38" stop-color="#a78bfa"/>
      <stop offset="0.68" stop-color="#60a5fa"/>
      <stop offset="1"    stop-color="#5eead4"/>
    </radialGradient>
  </defs>

  <!-- Tentáculos sueltos -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M46 68 q-6 9 0 18 t0 18" stroke="#5eead4"/>
    <path d="M58 68 q6 11 0 22 t0 22" stroke="#60a5fa"/>
    <path d="M70 68 q-6 11 0 22 t0 22" stroke="#a78bfa"/>
  </g>

  <!-- Campana pintada desde el punto de contacto -->
  <path d="M28 62 C28 38 44 22 64 22 C84 22 100 38 100 62 Q91 67 82 62 Q73 67 64 62 Q55 67 46 62 Q37 67 28 62 Z" fill="url(#paint)"/>

  <!-- Brillo -->
  <path d="M40 46 C43 37 50 31 58 29" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>

  <!-- Tentáculo que sube y toca la cabeza -->
  <path d="M84 66 C86 76 106 78 105 60 C104 50 97 41 91.4 35.2" fill="none" stroke="#f472b6" stroke-width="5" stroke-linecap="round"/>
</svg>
